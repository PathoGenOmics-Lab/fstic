[package]
name = "fstic"
version = "1.0.1"
edition = "2021"
authors = ["Paula Ruiz-Rodriguez <paula.ruiz.rodriguez@csic.es>"]
description = "High-performance pairwise genetic distance calculator from allele-frequency data"
license = "GPL-3.0"
repository = "https://github.com/PathoGenOmics-Lab/fstic"
keywords = ["genetics", "population-genetics", "fst", "distance-matrix", "bioinformatics"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
indicatif = "0.17"
num_cpus = "1.16"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
