name: Dependabot auto-merge

# Merges Dependabot's routine updates once CI has passed, and never touches a
# major one.
#
# The point of the split is that a minor or patch bump that survives the whole
# suite (83 tests, the MSRV build, the thread-count determinism check and the
# strict documentation build) has already been examined more carefully than a
# person would examine it by eye, while a major bump changes APIs and wants a
# person to look.
#
# Triggered by the pull request itself, not by a schedule.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge routine updates once CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read what this pull request updates
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The rule, decided once.
      #
      # It used to be written twice, once negated for the step that explains
      # itself, and the two halves drifted the moment the first was edited: a
      # grouped patch matched the merge step and the "left alone" step at the
      # same time, so it would have merged and announced that it had not. One
      # step decides, the other two read the answer.
      #
      # Named rather than excluded: merge when the pull request says in so many
      # words that it is a patch or a minor, or when it is a `-routine` group,
      # which the configuration already restricts to those two.
      #
      # Asking instead whether the update was "not major" let one through. A pip
      # requirement bump, `pillow ~=11.0` to `~=12.3`, reports no update type at
      # all, and an empty string is not equal to major, so the rule said yes to
      # a major on its first day. Anything this cannot positively identify still
      # waits for a person.
      #
      # The update-type test once applied only to ungrouped pull requests,
      # because it was unclear what a grouped one reports. It reports "the
      # highest semver change being made by this PR".
      #
      # That is not enough on its own, which the first Dependabot run here
      # showed: indicatif 0.17.9 -> 0.18.6 arrived in the `cargo-major` group
      # and reported `version-update:semver-minor`, and the two clauses being
      # ORed meant the minor reading overrode the group. Cargo treats the minor
      # component as the breaking one below 1.0, so Dependabot grouped it
      # correctly and `fetch-metadata`, reading the version numbers alone,
      # called it a minor. It queued itself for merge, and only the repository
      # having auto-merge switched off stopped it.
      #
      # So a `-major` group is a veto rather than an absence of permission. Any
      # 0.x dependency would otherwise walk through this gate.
      - name: Decide whether this one may merge itself
        id: decide
        env:
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          may_merge=false
          case "$GROUP" in
            *-routine) may_merge=true ;;
          esac
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) may_merge=true ;;
          esac
          # Applied last, and it overrules both: the group name is the reading
          # that knows about 0.x semantics, and the version numbers are not.
          case "$GROUP" in
            *-major) may_merge=false ;;
          esac
          # Printed because a decision nobody can read is a decision nobody can
          # correct: this line is what a later surprise gets diagnosed from.
          echo "group='${GROUP}' update-type='${UPDATE_TYPE}' -> may-merge=${may_merge}"
          echo "may-merge=${may_merge}" >> "$GITHUB_OUTPUT"

      - name: Queue the merge
        if: steps.decide.outputs.may-merge == 'true'
        run: |
          set -euo pipefail
          if ! out=$(gh pr merge --auto --merge "$PR_URL" 2>&1); then
            echo "$out" >&2
            # The failure that is a repository setting rather than a fault here.
            # Said plainly, with the fix, instead of a bare GraphQL error.
            if echo "$out" | grep -q 'Auto merge is not allowed'; then
              echo "::error::Auto-merge is switched off for this repository, so routine updates cannot merge themselves. Turn on Settings -> General -> Allow auto-merge."
            fi
            exit 1
          fi
          echo "$out"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why this one was left alone
        if: steps.decide.outputs.may-merge != 'true'
        run: |
          gh pr comment "$PR_URL" --body \
            "Left for review. Only a \`-routine\` group, or an update that identifies itself as patch or minor, merges on its own once CI passes, and never anything in a \`-major\` group. This one is a major update, is grouped as one, or does not say which it is."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
