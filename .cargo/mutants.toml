# Mutation testing configuration.
#
# `cargo mutants` changes the source (flips a comparison, replaces a function
# body with a default) and reports whether the test suite notices. A surviving
# mutant is a piece of logic no test distinguishes: either a test is missing, or
# the logic does not do anything, and both are worth knowing.
#
# It is advisory. A surviving mutant is a question, not a defect, and it never
# fails CI.

# The scientific core plus the readers that feed it. A flipped comparison in an
# estimator changes the distance someone publishes, and a flipped one in a
# reader changes which variants reach the estimator at all, which is the same
# thing one step earlier.
#
# The whole of src/ is examined rather than a subset. At 355 mutants that is
# affordable here, and drawing a boundary would mean maintaining it.
examine_globs = [
    "src/**/*.rs",
]

# The test module itself carries no logic under test.
exclude_globs = [
    "src/calculation/tests.rs",
]

# The whole suite, unit and integration alike. Integration tests drive the real
# binary through CARGO_BIN_EXE_fstic, which is what covers argument parsing,
# exit codes and the warnings, and none of that is reachable from --lib. It
# costs a rebuild per mutant and is worth it: the orchestration in main.rs is
# reachable no other way.
#
# The suite finishes in about a second, so anything still running after a minute
# is a mutant that made the code loop rather than one under test.
timeout_multiplier = 5.0
minimum_test_timeout = 60
